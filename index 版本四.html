<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>猜數字遊戲版本四</title>

    <style>
        body {
            margin: 0;
            font-family: "Microsoft JhengHei", sans-serif;
            background: #f1f5ee;
            color: #554f45;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: #fffdf8;
            padding: 45px 30px;
            border-radius: 22px;
            text-align: center;
            max-width: 500px;
            width: 85%;
            box-shadow: 0 5px 20px #00000010;
        }

        h1 {
            color: #587c67;
        }

        p {
            line-height: 1.8;
        }

        .features {
            text-align: left;
            background: #e8f0e9;
            padding: 18px 25px;
            border-radius: 12px;
            line-height: 2;
            margin: 25px 0;
        }

        .start-btn {
            display: inline-block;
            background: #587c67;
            color: white;
            text-decoration: none;
            padding: 14px 35px;
            border-radius: 12px;
            font-size: 18px;
        }

        .start-btn:hover {
            background: #456451;
        }

        .footer {
            color: #999;
            font-size: 12px;
            margin-top: 25px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🔢 猜數字遊戲版本四</h1>

    <p>
        歡迎來到猜數字遊戲！<br>
        使用 Google 帳號登入，開始你的挑戰吧！
    </p>

    <div class="features">
        ✨ 遊戲功能
        <br>・Google 帳號登入
        <br>・四位數字猜測
        <br>・幾 A 幾 B 即時回饋
        <br>・個人遊戲歷史紀錄
        <br>・未完成遊戲接續
        <br>・除錯模式
    </div>

    <a
        class="start-btn"
        href="https://script.google.com/a/macros/go.utaipei.edu.tw/s/AKfycbwALutf1U9P1KGfEPuAIrF1KzmRwXMxphzquueUWHCMpwkHm5AP35JzGoUEugwHKjg4BA/exec">
        開始遊戲
    </a>

    <div class="footer">
        猜數字遊戲版本四｜Google Apps Script 雲端版
    </div>

</div>

</body>
</html>
